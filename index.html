<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GX English Adventure - Worlds 1 to 15</title>
<style>
:root{--ink:#182033;--muted:#667085;--accent:#7c3aed;--accent2:#06b6d4;--good:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#74d9ff,#c4b5fd 55%,#ffd1e8)}
button{font:inherit}.app{max-width:1200px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ffffffeb;border-radius:22px;padding:14px 16px;box-shadow:0 14px 35px #0002}
.brand{font-size:clamp(21px,3vw,32px);font-weight:1000}.sub{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fff;border-radius:999px;padding:8px 11px;font-weight:900;box-shadow:0 5px 14px #0001}
.world-screen{margin-top:14px;background:#ffffffde;border-radius:28px;padding:18px;box-shadow:0 18px 40px #0002}
.world-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.world-card{position:relative;border:0;border-radius:24px;min-height:220px;padding:20px;text-align:left;color:#fff;cursor:pointer;overflow:hidden;box-shadow:0 15px 26px #0002;transition:.22s}
.world-card:hover{transform:translateY(-8px) scale(1.02)}
.world-card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#fff2;right:-65px;bottom:-70px}
.world-icon{font-size:60px;position:relative;z-index:2}.world-card h2{margin:12px 0 4px;position:relative;z-index:2}.world-card p{margin:0;opacity:.9;position:relative;z-index:2;font-size:13px}.world-count{position:absolute;bottom:16px;left:20px;font-weight:900;z-index:2}
.world-progress{position:absolute;left:20px;right:20px;bottom:45px;height:9px;border-radius:999px;background:#ffffff55;overflow:hidden;z-index:2}.world-progress span{display:block;height:100%;background:#fff;width:0}
.world-view{display:none;margin-top:14px;grid-template-columns:1.35fr .75fr;gap:14px}
.map{min-height:680px;position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(#84deff 0 47%,#6bce67 47% 100%);box-shadow:0 18px 40px #0002}
.sun{position:absolute;width:92px;height:92px;border-radius:50%;right:38px;top:35px;background:#ffe276;box-shadow:0 0 38px #fff3a0}
.cloud{position:absolute;width:120px;height:34px;border-radius:999px;background:#fff;opacity:.9;animation:cloud 20s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:42px;height:42px;left:18px;top:-18px}.cloud:after{width:54px;height:54px;right:13px;top:-24px}.c1{top:75px;left:-140px}.c2{top:145px;left:-190px;animation-delay:-9s;animation-duration:28s;transform:scale(.78)}@keyframes cloud{to{left:110%}}
.hill{position:absolute;left:-10%;right:-10%;bottom:-125px;height:370px;background:#369d4d;border-radius:50% 50% 0 0}.path{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:175px;height:420px;background:#eac891;clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.titlebox{position:absolute;left:18px;top:18px;background:#ffffffdc;border-radius:18px;padding:12px 14px;z-index:5}.back{position:absolute;right:18px;top:18px;z-index:6;border:0;border-radius:999px;padding:9px 13px;background:#fff;font-weight:900;cursor:pointer}
.stages{position:absolute;inset:112px 20px 165px;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:13px;align-content:start}
.stage{cursor:pointer;border:0;border-radius:20px;padding:14px 10px;background:#fff;box-shadow:0 10px 18px #0002;transition:.2s;min-height:122px;text-align:center}.stage:hover,.stage.active{transform:translateY(-6px) scale(1.02);outline:4px solid color-mix(in srgb,var(--accent) 28%,transparent)}.stage .ico{font-size:36px}.stage h3{margin:7px 0 3px;font-size:15px}.stage p{margin:0;color:var(--muted);font-size:12px}
.hero{position:absolute;left:42%;bottom:55px;z-index:6;text-align:center;animation:bob 1.4s ease-in-out infinite}.face{width:61px;height:61px;border-radius:50%;background:#ffd5b0;border:5px solid var(--accent);margin:auto;position:relative}.face:after{content:"•  •";position:absolute;left:0;right:0;top:18px;text-align:center;font-size:20px}.body{width:75px;height:70px;border-radius:24px 24px 15px 15px;background:linear-gradient(var(--accent2),var(--accent));margin:-3px auto 0}.name{font-size:11px;font-weight:900;background:#fff;border-radius:999px;padding:5px 8px;margin-top:6px}.pet{position:absolute;left:55%;bottom:70px;z-index:6;font-size:50px;animation:hop 1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes hop{50%{transform:translateY(-9px) rotate(5deg)}}
.side{background:#ffffffeb;border-radius:28px;padding:16px;box-shadow:0 18px 40px #0002;display:flex;flex-direction:column;gap:12px}.card{background:#fff;border-radius:19px;padding:14px;box-shadow:0 7px 16px #0001}.card h2,.card h3{margin:0 0 7px}
.btn{border:0;border-radius:15px;padding:13px 15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:1000;cursor:pointer;width:100%;box-shadow:0 9px 18px #0002}.btn:active{transform:scale(.98)}
.progress{height:11px;border-radius:999px;background:#e5e7eb;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#f97316,#facc15);transition:.3s}.wordgrid{display:flex;gap:6px;flex-wrap:wrap;max-height:220px;overflow:auto}.chip{font-size:11px;background:#eef2ff;color:#4338ca;padding:5px 8px;border-radius:999px}
.overlay{position:fixed;inset:0;background:#111827d9;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.gamebox{width:min(760px,100%);background:#fff;border-radius:28px;padding:20px;box-shadow:0 30px 80px #0006;max-height:95vh;overflow:auto}.gamehead{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{border:0;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;background:#ede9fe;color:#5b21b6}
.q{font-size:clamp(25px,5vw,42px);font-weight:1000;text-align:center;margin:25px 0 5px}.hint{text-align:center;color:var(--muted);margin-bottom:18px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer,.letter,.memory{border:3px solid #e5e7eb;background:#f8fafc;border-radius:17px;padding:16px;font-weight:900;cursor:pointer;font-size:18px}.answer:hover,.letter:hover,.memory:hover{border-color:var(--accent);background:#f5f3ff}.good{border-color:var(--good)!important;background:#dcfce7!important}.bad{border-color:var(--bad)!important;background:#fee2e2!important}.feedback{min-height:30px;text-align:center;font-weight:1000;margin-top:12px}.timer{font-size:20px;font-weight:1000;color:#b45309}
.memorygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.memory{min-height:62px;font-size:12px;padding:10px}.memory.hidden{color:transparent;background:var(--accent);position:relative}.memory.hidden:after{content:"?";color:#fff;font-size:26px;position:absolute;inset:0;display:grid;place-items:center}.spellrow{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:15px 0}.slot{min-width:38px;height:48px;border-bottom:4px solid var(--accent);display:grid;place-items:center;font-size:28px;font-weight:1000}.letters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.letter{padding:12px 16px}.bossbar{height:18px;background:#fee2e2;border-radius:999px;overflow:hidden;margin:12px 0}.bosshp{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f97316);transition:.3s}.shake{animation:shake .32s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@media(max-width:1100px){.world-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:950px){.world-grid{grid-template-columns:repeat(2,1fr)}.world-view{grid-template-columns:1fr}.map{min-height:740px}.stages{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.world-grid{grid-template-columns:1fr}.top{align-items:flex-start}.stats{justify-content:flex-end}.map{min-height:850px}.stages{grid-template-columns:1fr 1fr;inset:112px 12px 170px}.stage{min-height:112px;padding:11px 7px}.answers{grid-template-columns:1fr}.memorygrid{grid-template-columns:repeat(2,1fr)}}

.correct-fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;display:none}
.correct-fx.show{display:block}
.fx-title{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%) scale(.3);font-weight:1000;font-size:clamp(34px,8vw,86px);color:#fff;text-shadow:0 5px 0 #0005,0 0 25px #fff;animation:fxTitle .9s ease-out forwards;white-space:nowrap}
@keyframes fxTitle{35%{transform:translate(-50%,-50%) scale(1.25)}65%{transform:translate(-50%,-50%) scale(.95)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.fx-creature{position:absolute;left:-30%;top:40%;font-size:clamp(90px,22vw,230px);filter:drop-shadow(0 15px 16px #0005);animation:creatureFly 1.05s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes creatureFly{0%{left:-30%;transform:rotate(-12deg) scale(.7)}45%{left:38%;transform:rotate(4deg) scale(1.25)}100%{left:120%;transform:rotate(12deg) scale(.8);opacity:0}}
.fx-ring{position:absolute;left:50%;top:50%;width:80px;height:80px;border:10px solid #fff;border-radius:50%;transform:translate(-50%,-50%);animation:ringBlast .8s ease-out forwards}
@keyframes ringBlast{to{width:120vmax;height:120vmax;opacity:0;border-width:2px}}
.fx-particle{position:absolute;font-size:clamp(22px,5vw,54px);animation:particleBurst 1s ease-out forwards}
@keyframes particleBurst{0%{transform:translate(0,0) scale(.2);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(480deg) scale(1.2);opacity:0}}
.fx-flash{position:absolute;inset:0;background:#fff;animation:flash .45s ease-out forwards}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.shop-btn{border:0;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;box-shadow:0 6px 14px #f9731633}
.shop-overlay{position:fixed;inset:0;background:#111827d9;z-index:30;display:none;align-items:center;justify-content:center;padding:14px}
.shop-panel{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:28px;padding:20px;box-shadow:0 30px 80px #0006}
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pet-card{border:3px solid #e5e7eb;border-radius:20px;padding:14px;text-align:center;background:#f8fafc}
.pet-card.owned{border-color:#22c55e;background:#f0fdf4}
.pet-card.equipped{outline:5px solid #8b5cf633}
.pet-emoji{font-size:64px;line-height:1}
.pet-name{font-weight:1000;margin-top:8px}
.pet-price{font-size:13px;color:var(--muted);margin:4px 0 10px}
.pet-action{border:0;border-radius:13px;padding:10px 12px;width:100%;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff}
.pet-action:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:650px){.pet-grid{grid-template-columns:repeat(2,1fr)}}


.wrong-fx{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden;display:none;background:#120d22aa}
.wrong-fx.show{display:block}
.wrong-title{position:absolute;left:50%;top:16%;transform:translate(-50%,-50%) scale(.4);font-size:clamp(30px,7vw,76px);font-weight:1000;color:#fff;text-shadow:0 5px 0 #0007,0 0 22px #ef4444;animation:wrongTitle 1s ease-out forwards;white-space:nowrap}
@keyframes wrongTitle{35%{transform:translate(-50%,-50%) scale(1.2)}70%{transform:translate(-50%,-50%) scale(.95)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.fx-player{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);font-size:clamp(80px,18vw,180px);filter:drop-shadow(0 14px 14px #0006)}
.fx-monster{position:absolute;font-size:clamp(120px,28vw,280px);filter:drop-shadow(0 18px 18px #0007)}
.fx-damage{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:clamp(65px,16vw,150px);animation:damagePop .8s ease-out forwards}
@keyframes damagePop{0%{transform:translate(-50%,-50%) scale(.2)}45%{transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
.fx-heart{position:absolute;right:12%;top:18%;font-size:clamp(45px,9vw,95px);animation:heartBreak 1s ease-out forwards}
@keyframes heartBreak{0%{transform:scale(.2)}45%{transform:scale(1.5) rotate(-12deg)}100%{opacity:0;transform:scale(.6) translateY(120px)}}
.screen-shock{position:absolute;inset:0;background:#ef444455;animation:shock .5s ease-out forwards}
@keyframes shock{0%{opacity:1}100%{opacity:0}}
.swallow-monster{left:50%;top:34%;transform:translate(-50%,-50%);animation:monsterGrow 1.05s ease-in forwards}
.swallowed-player{animation:swallowed 1.05s ease-in forwards}
@keyframes monsterGrow{0%{transform:translate(-50%,-50%) scale(.4)}60%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1.45)}}
@keyframes swallowed{0%{transform:translateX(-50%) scale(1)}65%{bottom:39%;transform:translateX(-50%) scale(.55) rotate(8deg)}100%{bottom:48%;transform:translateX(-50%) scale(0);opacity:0}}
.fireball{position:absolute;left:-15%;top:47%;font-size:clamp(80px,17vw,170px);animation:fireFly .85s ease-in forwards}
@keyframes fireFly{to{left:48%;transform:rotate(540deg) scale(1.25)}}
.lightning{position:absolute;left:50%;top:-25%;transform:translateX(-50%);font-size:clamp(180px,42vw,440px);animation:lightningHit .75s ease-in forwards}
@keyframes lightningHit{55%{top:15%}100%{top:20%;opacity:0}}
.ice-prison{position:absolute;left:50%;bottom:12%;transform:translateX(-50%) scale(.2);font-size:clamp(150px,33vw,340px);animation:iceGrow 1s ease-out forwards}
@keyframes iceGrow{45%{transform:translateX(-50%) scale(1.3)}100%{transform:translateX(-50%) scale(1);opacity:.85}}
.trap-hole{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-size:clamp(110px,24vw,250px)}
.fall-player{animation:fallIn .9s ease-in forwards}
@keyframes fallIn{65%{bottom:8%}100%{bottom:-22%;transform:translateX(-50%) scale(.3);opacity:0}}
.knock-monster{left:-18%;bottom:16%;animation:knockCharge .9s ease-in forwards}
@keyframes knockCharge{to{left:43%}}
.knocked-player{animation:knocked 1s ease-out forwards}
@keyframes knocked{55%{left:65%;bottom:32%;transform:translateX(-50%) rotate(35deg)}100%{left:118%;bottom:55%;transform:translateX(-50%) rotate(100deg);opacity:0}}

.spelling-input{display:block;width:min(520px,100%);margin:18px auto 12px;border:4px solid #dbe4f0;border-radius:18px;padding:16px 18px;font-size:clamp(22px,4vw,34px);font-weight:900;text-align:center;outline:none;background:#fff;box-shadow:0 9px 18px #0001}
.spelling-input:focus{border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 14%,transparent)}
.spelling-submit{width:min(300px,100%);display:block;margin:0 auto}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">GX English Adventure</div><div class="sub">15 Worlds · 6 Game Modes · Vocabulary Adventure</div></div>
    <div class="stats"><div class="pill">XP <span id="xp">0</span></div><div class="pill">Coins <span id="coins">0</span></div><div class="pill">Lives <span id="lives">3</span></div><button id="shopBtn" class="shop-btn">Pet Shop</button><button id="musicBtn" class="shop-btn">Music: ON</button></div>
  </div>
  <div id="worldScreen" class="world-screen"><h1>Choose a World</h1><p>Complete all 6 stages in each world.</p><div id="worldGrid" class="world-grid"></div></div>
  <div id="worldView" class="world-view">
    <div class="map"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill"></div><div class="path"></div><div class="titlebox"><b id="mapTitle"></b><div id="mapSub" class="sub"></div></div><button id="backBtn" class="back">Back</button>
      <div class="stages">
        <button class="stage active" data-stage="rush"><div class="ico">⚡</div><h3>Word Rush</h3><p>Quick meaning match</p></button>
        <button class="stage" data-stage="clue"><div class="ico">🔎</div><h3>Clue Hunt</h3><p>Chinese clue to English</p></button>
        <button class="stage" data-stage="memory"><div class="ico">🧠</div><h3>Memory Match</h3><p>Pair English and Chinese</p></button>
        <button class="stage" data-stage="spell"><div class="ico">⌨️</div><h3>Spell Forge</h3><p>Type the full word</p></button>
        <button class="stage" data-stage="speed"><div class="ico">⏱️</div><h3>Speed Trial</h3><p>Race through the words</p></button>
        <button class="stage" data-stage="boss"><div class="ico">👾</div><h3>World Boss</h3><p>Defeat the boss</p></button>
      </div>
      <div class="hero"><div class="face"></div><div class="body"></div><div class="name">GX HERO</div></div><div id="pet" class="pet">🐶</div>
    </div>
    <div class="side"><div class="card"><h2 id="crystalName">Crystal</h2><div class="progress"><div id="worldBar" class="bar"></div></div><div id="worldText" class="sub">0 / 6 stages</div></div><div class="card"><h3 id="stageTitle">Word Rush</h3><p id="stageDesc"></p><button id="playBtn" class="btn">Play Word Rush</button></div><div class="card"><h3 id="wordCount"></h3><div id="wordGridSide" class="wordgrid"></div></div><div class="card"><b>Status</b><div id="status" class="sub">Ready.</div><div>Total Crystals: <span id="totalCrystals">0</span></div></div></div>
  </div>
</div>
<div id="overlay" class="overlay"><div id="gamebox" class="gamebox"><div class="gamehead"><div><b id="modeTitle"></b><div id="qnum" class="sub"></div></div><div><span id="timer" class="timer"></span> <button id="closeBtn" class="close">×</button></div></div><div id="bossWrap" style="display:none"><div class="bossbar"><div id="bossHp" class="bosshp"></div></div></div><div id="gameArea"></div><div id="feedback" class="feedback"></div></div></div>
<div id="correctFx" class="correct-fx"></div><div id="wrongFx" class="wrong-fx"></div>
<div id="shopOverlay" class="shop-overlay"><div class="shop-panel"><div class="shop-head"><div><h2>Pet Shop</h2><div>Coins: <b id="shopCoins">0</b></div></div><button id="shopClose" class="close">×</button></div><div id="petGrid" class="pet-grid"></div></div></div>
<script>
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
const WORLDS={
 w1:{title:"Home & Family",subtitle:"Everyday people and places",icon:"🏠",color1:"#7c3aed",color2:"#06b6d4",words:[["family","家庭"],["father","爸爸"],["mother","妈妈"],["brother","兄弟"],["sister","姐妹"],["home","家"],["room","房间"],["kitchen","厨房"],["garden","花园"],["door","门"]]},
 w2:{title:"School",subtitle:"Learn, read and grow",icon:"🎒",color1:"#2563eb",color2:"#14b8a6",words:[["school","学校"],["teacher","老师"],["student","学生"],["book","书"],["pencil","铅笔"],["classroom","课室"],["lesson","课程"],["homework","功课"],["question","问题"],["answer","答案"]]},
 w3:{title:"Food",subtitle:"Tasty vocabulary",icon:"🍎",color1:"#f97316",color2:"#eab308",words:[["food","食物"],["rice","米饭"],["bread","面包"],["milk","牛奶"],["water","水"],["fruit","水果"],["vegetable","蔬菜"],["breakfast","早餐"],["lunch","午餐"],["dinner","晚餐"]]},
 w4:{title:"Animals",subtitle:"Wild and friendly",icon:"🦁",color1:"#16a34a",color2:"#84cc16",words:[["animal","动物"],["cat","猫"],["dog","狗"],["bird","鸟"],["fish","鱼"],["lion","狮子"],["tiger","老虎"],["elephant","大象"],["monkey","猴子"],["rabbit","兔子"]]},
 w5:{title:"Places",subtitle:"Around the town",icon:"🏙️",color1:"#0ea5e9",color2:"#8b5cf6",words:[["place","地方"],["park","公园"],["shop","商店"],["market","市场"],["hospital","医院"],["library","图书馆"],["station","车站"],["road","道路"],["city","城市"],["village","乡村"]]},
 w6:{title:"Colours",subtitle:"A bright world",icon:"🎨",color1:"#ec4899",color2:"#8b5cf6",words:[["red","红色"],["blue","蓝色"],["green","绿色"],["yellow","黄色"],["black","黑色"],["white","白色"],["orange","橙色"],["purple","紫色"],["pink","粉红色"],["brown","棕色"]]},
 w7:{title:"Numbers",subtitle:"Count your way forward",icon:"🔢",color1:"#6366f1",color2:"#06b6d4",words:[["one","一"],["two","二"],["three","三"],["four","四"],["five","五"],["six","六"],["seven","七"],["eight","八"],["nine","九"],["ten","十"]]},
 w8:{title:"Time",subtitle:"Days, clocks and routines",icon:"🕒",color1:"#9333ea",color2:"#3b82f6",words:[["time","时间"],["day","天"],["week","星期"],["month","月"],["year","年"],["morning","早上"],["afternoon","下午"],["evening","傍晚"],["night","晚上"],["today","今天"]]},

const modes={rush:["Word Rush","Choose the correct Chinese meaning."],clue:["Clue Hunt","Choose the correct English word."],memory:["Memory Match","Match English and Chinese pairs."],spell:["Spell Forge","Type the full English word."],speed:["Speed Trial","Answer every word as quickly as possible."],boss:["World Boss","Defeat the boss with correct answers."]};
const state={xp:0,coins:0,lives:3,currentWorld:null,selected:"rush",completed:{},index:0,score:0,wrongLog:[],questions:[],locked:false,timer:null,time:0,bossHP:0,equippedPet:"dog",ownedPets:new Set(["dog"])};

function tone(freq,dur=.12,type="sine",vol=.08){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}
function startBgm(){if(!musicOn||bgmTimer)return;bgmTimer=setInterval(()=>{const notes=[262,330,392,523,392,330,294,349,440,587,440,349];tone(notes[bgmStep++%notes.length],.28,"triangle",.045)},320)}
function toggleMusic(){musicOn=!musicOn;$("musicBtn").textContent="Music: "+(musicOn?"ON":"OFF");if(musicOn)startBgm();else{clearInterval(bgmTimer);bgmTimer=null}}
function playScoreSound(){tone(660,.09,"square",.09);setTimeout(()=>tone(880,.12,"square",.08),90)}

function equippedEmoji(){const pet=PET_SHOP.find(p=>p.id===state.equippedPet);return pet?pet.emoji:"🐶"}
function showCorrectEffect(){const fx=$("correctFx"),e=CORRECT_EFFECTS[Math.floor(Math.random()*CORRECT_EFFECTS.length)];fx.innerHTML='<div class="fx-flash"></div><div class="fx-ring"></div><div class="fx-title">'+e.title+'</div><div class="fx-creature">'+e.creature+'</div>';for(let i=0;i<18;i++){const p=document.createElement("div");p.className="fx-particle";p.textContent=e.particles[i%e.particles.length];p.style.left=(45+Math.random()*10)+"%";p.style.top=(42+Math.random()*16)+"%";p.style.setProperty("--dx",((Math.random()-.5)*900)+"px");p.style.setProperty("--dy",((Math.random()-.5)*650)+"px");fx.appendChild(p)}fx.classList.remove("show");void fx.offsetWidth;fx.classList.add("show");setTimeout(()=>{fx.classList.remove("show");fx.innerHTML=""},1100)}
function renderPetShop(){$("shopCoins").textContent=state.coins;$("petGrid").innerHTML="";PET_SHOP.forEach(p=>{const owned=state.ownedPets.has(p.id),equipped=state.equippedPet===p.id,card=document.createElement("div");card.className="pet-card"+(owned?" owned":"")+(equipped?" equipped":"");const label=equipped?"Equipped":owned?"Equip":"Buy";card.innerHTML=`<div class="pet-emoji">${p.emoji}</div><div class="pet-name">${p.name}</div><div class="pet-price">${p.price===0?"Starter Pet":"🪙 "+p.price}</div><button class="pet-action" ${equipped?"disabled":""}>${label}</button>`;card.querySelector("button").addEventListener("click",()=>{if(owned){state.equippedPet=p.id;$("pet").textContent=p.emoji;renderPetShop();$("status").textContent=p.name+" is now following you."}else if(state.coins>=p.price){state.coins-=p.price;state.ownedPets.add(p.id);state.equippedPet=p.id;$("pet").textContent=p.emoji;sync();renderPetShop();showCorrectEffect();$("status").textContent="Unlocked "+p.name+"!"}else{$("status").textContent="Not enough coins for "+p.name+".";const btn=card.querySelector("button");btn.textContent="Need "+(p.price-state.coins)+" more";setTimeout(renderPetShop,900)}});$("petGrid").appendChild(card)})}
$("shopBtn").addEventListener("click",()=>{$("shopOverlay").style.display="flex";renderPetShop()});$("shopClose").addEventListener("click",()=>{$("shopOverlay").style.display="none"});$("shopOverlay").addEventListener("click",e=>{if(e.target===$("shopOverlay"))$("shopOverlay").style.display="none"});
function current(){return WORLDS[state.currentWorld]} function words(){return current().words} function totalDone(){return Object.values(state.completed).reduce((n,s)=>n+s.size,0)}
function sync(){$("xp").textContent=state.xp;$("coins").textContent=state.coins;$("lives").textContent=state.lives;$("totalCrystals").textContent=totalDone();if($("shopCoins"))$("shopCoins").textContent=state.coins;if(state.currentWorld){const done=state.completed[state.currentWorld].size;$("worldBar").style.width=(done/6*100)+"%";$("worldText").textContent=done+" / 6 stages"}renderWorldCards()}
function renderWorldCards(){const grid=$("worldGrid");grid.innerHTML="";Object.entries(WORLDS).forEach(([id,w],idx)=>{const done=state.completed[id].size,b=document.createElement("button");b.className="world-card";b.style.background=`linear-gradient(145deg,${w.color1},${w.color2})`;b.innerHTML=`<div class="world-icon">${w.icon}</div><h2>World ${idx+1}</h2><p>${w.title}</p><p>${w.words.length} PDF words</p><div class="world-progress"><span style="width:${done/6*100}%"></span></div><div class="world-count">${done}/6 stages</div>`;b.addEventListener("click",()=>openWorld(id));grid.appendChild(b)})}
function openWorld(id){if(musicOn)startBgm();state.currentWorld=id;state.selected="rush";const w=current();document.documentElement.style.setProperty("--accent",w.color1);document.documentElement.style.setProperty("--accent2",w.color2);$("worldScreen").style.display="none";$("worldView").style.display="grid";$("mapTitle").textContent=w.title;$("mapSub").textContent=w.subtitle+" · "+w.words.length+" PDF words";$("pet").textContent=equippedEmoji();$("crystalName").textContent=w.icon+" Crystal";$("wordCount").textContent="PDF Vocabulary · "+w.words.length+" words";$("wordGridSide").innerHTML=w.words.map(x=>`<span class="chip">${x[0]}</span>`).join("");document.querySelectorAll(".stage").forEach(x=>x.classList.remove("active"));document.querySelector('.stage[data-stage="rush"]').classList.add("active");$("stageTitle").textContent=modes.rush[0];$("stageDesc").textContent=modes.rush[1];$("playBtn").textContent="Play Word Rush";sync()}
$("backBtn").addEventListener("click",()=>{$("worldView").style.display="none";$("worldScreen").style.display="block";state.currentWorld=null;sync()});document.querySelectorAll(".stage").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".stage").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.selected=b.dataset.stage;$("stageTitle").textContent=modes[state.selected][0];$("stageDesc").textContent=modes[state.selected][1];$("playBtn").textContent="Play "+modes[state.selected][0]}));$("playBtn").addEventListener("click",startMode);$("closeBtn").addEventListener("click",closeGame);
function randomWords(n){return shuffle(words()).slice(0,n)} function opts(item,english=false){const field=english?0:1;return shuffle([item[field],...shuffle(words().filter(w=>w[0]!==item[0])).slice(0,3).map(w=>w[field])])}
function openGame(){$("overlay").style.display="flex";$("modeTitle").textContent=modes[state.selected][0];$("feedback").textContent="";$("bossWrap").style.display="none"} function closeGame(){clearInterval(state.timer);$("overlay").style.display="none";$("timer").textContent=""}
function startMode(){state.index=0;state.score=0;state.wrongLog=[];state.lives=3;state.locked=false;sync();openGame();if(state.selected==="memory")startMemory();else if(state.selected==="spell")startSpell();else if(state.selected==="speed")startSpeed();else if(state.selected==="boss")startBoss();else{state.questions=shuffle(words());showStandard()}}
function showStandard(){state.locked=false;const item=state.questions[state.index];$("qnum").textContent=(state.index+1)+" / "+state.questions.length;const english=state.selected==="clue";$("gameArea").innerHTML=`<div class="q">${english?item[1]:item[0]}</div><div class="hint">${english?"选择正确的英文词汇":"选择正确的华语意思"}</div><div class="answers">${opts(item,english).map(o=>`<button class="answer">${o}</button>`).join("")}</div>`;document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>check(b,b.textContent,item,english)))}
function check(btn,val,item,english){if(state.locked)return;state.locked=true;const correct=item[english?0:1];if(val===correct){btn.classList.add("good");state.score++;reward(20,10);$("feedback").textContent="Correct! +20 XP";$("feedback").style.color="var(--good)";setTimeout(()=>{state.index++;state.index>=state.questions.length?complete():showStandard()},600)}else{btn.classList.add("bad");state.xp=Math.max(0,state.xp-10);state.coins=Math.max(0,state.coins-5);state.wrongLog.push({q:item[0],your:val,correct:correct});lose();sync();$("feedback").textContent="Correct: "+correct;$("feedback").style.color="var(--bad)";setTimeout(()=>{state.index++;state.index>=state.questions.length?complete():showStandard()},1200)}}
function startMemory(){const chosen=shuffle(words()),cards=shuffle(chosen.flatMap(w=>[{p:w[0],t:w[0]},{p:w[0],t:w[1]}]));state.questions=chosen;let open=[],matched=0;$("qnum").textContent="Match all "+chosen.length+" pairs";$("gameArea").innerHTML=`<div class="q">Memory Match</div><div class="hint">Match English with Chinese.</div><div class="memorygrid">${cards.map(c=>`<button class="memory hidden" data-p="${c.p}">${c.t}</button>`).join("")}</div>`;document.querySelectorAll(".memory").forEach(c=>c.addEventListener("click",()=>{if(c.classList.contains("good")||open.includes(c)||open.length===2)return;c.classList.remove("hidden");open.push(c);if(open.length===2){if(open[0].dataset.p===open[1].dataset.p){open.forEach(x=>x.classList.add("good"));open=[];matched++;state.score++;reward(15,5);if(matched===chosen.length)setTimeout(complete,450)}else{state.wrongLog.push({q:open[0].textContent+" + "+open[1].textContent,your:"Wrong pair",correct:"Match the correct English and Chinese pair"});lose();setTimeout(()=>{open.forEach(x=>x.classList.add("hidden"));open=[]},650)}}}))}
function startSpell(){state.questions=shuffle(words());state.index=0;showSpell()}
function showSpell(){if(state.index>=state.questions.length){complete();return}const item=state.questions[state.index],word=item[0];state.locked=false;$("qnum").textContent=(state.index+1)+" / "+state.questions.length;$("gameArea").innerHTML=`<div class="q">${item[1]}</div><div class="hint">根据华语，拼写完整英文词汇。</div><input id="spellingInput" class="spelling-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the full English word"><button id="spellingSubmit" class="btn spelling-submit">Submit</button>`;const input=$("spellingInput"),submit=$("spellingSubmit");input.focus();function submitSpelling(){if(state.locked)return;const typed=input.value.trim();if(!typed)return;state.locked=true;input.disabled=true;submit.disabled=true;const isCorrect=typed.toLowerCase()===word.toLowerCase();if(isCorrect){input.classList.add("good");state.score++;reward(25,10);$("feedback").textContent="Correct spelling: "+word;$("feedback").style.color="var(--good)"}else{input.classList.add("bad");state.xp=Math.max(0,state.xp-10);state.coins=Math.max(0,state.coins-5);state.wrongLog.push({q:item[1],your:typed,correct:word});lose();sync();$("feedback").textContent="Correct answer: "+word;$("feedback").style.color="var(--bad)"}setTimeout(()=>{state.index++;showSpell()},1200)}submit.addEventListener("click",submitSpelling);input.addEventListener("keydown",e=>{if(e.key==="Enter")submitSpelling()})}
function startSpeed(){state.time=0;state.questions=shuffle(words());state.index=0;$("timer").textContent="0s";state.timer=setInterval(()=>{state.time++;$("timer").textContent=state.time+"s"},1000);showSpeed()}
function showSpeed(){if(state.index>=state.questions.length){clearInterval(state.timer);complete();return}state.locked=false;const item=state.questions[state.index];$("qnum").textContent=(state.index+1)+" / "+state.questions.length;$("gameArea").innerHTML=`<div class="q">${item[0]}</div><div class="hint">快速选择正确意思</div><div class="answers">${opts(item).map(o=>`<button class="answer">${o}</button>`).join("")}</div>`;document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>{if(state.locked)return;state.locked=true;if(b.textContent===item[1]){b.classList.add("good");state.score++;reward(8,3);state.index++;setTimeout(showSpeed,220)}else{b.classList.add("bad");state.wrongLog.push({q:item[0],your:b.textContent,correct:item[1]});lose();$("feedback").textContent="Correct answer: "+item[1];setTimeout(()=>{state.index++;showSpeed()},1150)}}))}
function startBoss(){playBossSound();state.questions=shuffle(words());state.index=0;state.bossHP=state.questions.length;$("bossWrap").style.display="block";$("bossHp").style.width="100%";showBoss()}
function showBoss(){if(state.index>=state.questions.length){setTimeout(complete,350);return}state.locked=false;const item=state.questions[state.index];$("qnum").textContent="Boss attack "+(state.index+1)+" / "+state.questions.length;$("gameArea").innerHTML=`<div class="q">${item[0]}</div><div class="hint">Choose correctly to attack the World Boss.</div><div class="answers">${opts(item).map(o=>`<button class="answer">${o}</button>`).join("")}</div>`;document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>{if(state.locked)return;state.locked=true;if(b.textContent===item[1]){b.classList.add("good");state.score++;state.bossHP--;const pct=(state.bossHP/state.questions.length)*100;$("bossHp").style.width=pct+"%";reward(30,15);$("feedback").textContent="Critical hit!";playAttackSound();state.index++;setTimeout(showBoss,420)}else{b.classList.add("bad");state.wrongLog.push({q:item[0],your:b.textContent,correct:item[1]});lose();$("gamebox").classList.add("shake");setTimeout(()=>$("gamebox").classList.remove("shake"),320);$("feedback").textContent="Correct answer: "+item[1];state.index++;setTimeout(showBoss,1200)}}))}
function reward(x,c){state.xp+=x;state.coins+=c;sync();playScoreSound();showCorrectEffect()} function lose(){playDamageSound();showWrongEffect();state.lives=Math.max(0,state.lives-1);sync()}
function speakWorldSummary(correct,wrong,score){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const worldNumber=Object.keys(WORLDS).indexOf(state.currentWorld)+1;const text=`World ${worldNumber} complete. You got ${correct} correct, ${wrong} wrong, and your score is ${score} percent.`;const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;u.pitch=1.05;u.volume=1;const voices=window.speechSynthesis.getVoices();const preferred=voices.find(v=>/en-US/i.test(v.lang)&&/female|zira|samantha|google us english/i.test(v.name))||voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(preferred)u.voice=preferred;window.speechSynthesis.speak(u)}
function complete(){clearInterval(state.timer);const set=state.completed[state.currentWorld];if(!set.has(state.selected)){set.add(state.selected);state.xp+=100;state.coins+=50}sync();const total=state.questions.length||1,wrong=Math.min(state.wrongLog.length,total),correct=Math.max(0,total-wrong),acc=Math.round(correct/total*100);let review=state.wrongLog.length?state.wrongLog.map((x,i)=>`<div style="text-align:left;padding:8px;border-bottom:1px solid #ddd"><b>Q${i+1}</b> ${x.q}<br>Your: <span style="color:#dc2626">${x.your}</span><br>Correct: <span style="color:#16a34a">${x.correct}</span></div>`).join(""):"<p>Perfect! No mistakes.</p>";$("gameArea").innerHTML=`<div class="q">Battle Report</div><div class="hint">Correct ${correct}/${total} · Wrong ${wrong} · Score ${acc}%</div><div class="hint">XP +100 · Coins +50</div><h3>Mistake Review</h3><div style="max-height:260px;overflow:auto">${review}</div><button class="btn" id="returnBtn">Return to World Map</button>`;$("feedback").textContent=wrong?("Review "+wrong+" mistakes."):"Perfect Clear!";$("feedback").style.color="var(--good)";$("returnBtn").addEventListener("click",closeGame);$("status").textContent=modes[state.selected][0]+" completed.";setTimeout(()=>speakWorldSummary(correct,wrong,acc),250)}
if(document.getElementById("musicBtn"))document.getElementById("musicBtn").addEventListener("click",toggleMusic);renderWorldCards();sync();$("pet").textContent=equippedEmoji();
