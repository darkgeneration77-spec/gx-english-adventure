<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GX English Adventure</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#7dd3fc,#c4b5fd,#fbcfe8);color:#172033}button{font:inherit}.app{max-width:1100px;margin:auto;padding:14px}.top,.panel{background:#fffd;border-radius:20px;padding:14px;box-shadow:0 10px 25px #0002}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#fff;padding:8px 10px;border-radius:999px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.world{border:0;border-radius:20px;padding:18px;text-align:left;color:#fff;min-height:150px;cursor:pointer}.world b{font-size:20px}.world small{display:block;margin-top:6px}.view{display:none;grid-template-columns:1fr 320px;gap:14px;margin-top:14px}.map{background:linear-gradient(#7dd3fc 45%,#65c466 45%);border-radius:24px;padding:18px;min-height:560px}.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:70px}.stage{border:0;background:#fff;border-radius:18px;padding:18px;cursor:pointer;font-weight:700}.side{display:flex;flex-direction:column;gap:10px}.btn{border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:800;cursor:pointer}.words{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto}.chip{background:#eef2ff;padding:5px 8px;border-radius:999px;font-size:12px}.overlay{position:fixed;inset:0;background:#111c;display:none;align-items:center;justify-content:center;padding:14px}.game{background:#fff;border-radius:24px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{border:2px solid #ddd;border-radius:14px;padding:15px;background:#fafafa;cursor:pointer}.good{background:#dcfce7;border-color:#16a34a}.bad{background:#fee2e2;border-color:#dc2626}.fx{position:fixed;inset:0;display:none;place-items:center;font-size:90px;background:#1118;z-index:20}.fx.show{display:grid;animation:pop 1s}@keyframes pop{0%{transform:scale(.2)}45%{transform:scale(1.25)}100%{transform:scale(1);opacity:0}}.shop{position:fixed;inset:0;background:#111c;display:none;align-items:center;justify-content:center}.shopbox{background:#fff;border-radius:20px;padding:18px;width:min(650px,95%)}.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.petcard{border:2px solid #ddd;border-radius:16px;padding:12px;text-align:center}.petemoji{font-size:50px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.view{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.answers,.stages{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="top"><div><h2 style="margin:0">GX English Adventure</h2><small>CEFR A1 · Worlds 1–15</small></div><div class="stats"><span class="pill">⭐ <i id="xp">0</i></span><span class="pill">🪙 <i id="coins">0</i></span><span class="pill">❤️ <i id="lives">3</i></span><button id="shopBtn" class="btn">🐾 Pets</button></div></div><section id="home"><div id="grid" class="grid"></div></section><section id="view" class="view"><div class="map"><button id="back" class="btn">← Worlds</button><h2 id="wtitle"></h2><div class="stages"><button class="stage" data-mode="rush">⚡ Word Rush</button><button class="stage" data-mode="reverse">🔎 Chinese → English</button><button class="stage" data-mode="spell">✍️ Spelling</button><button class="stage" data-mode="boss">👑 Boss</button></div></div><aside class="side"><div class="panel"><b id="modeTitle">Word Rush</b><p id="desc">Choose a mode.</p></div><button id="play" class="btn">Play</button><div class="panel"><b id="count"></b><div id="wordlist" class="words"></div></div></aside></section></div><div id="overlay" class="overlay"><div class="game"><div style="display:flex;justify-content:space-between"><b id="gameTitle"></b><button id="close">✕</button></div><p id="progress"></p><h1 id="question"></h1><div id="answers" class="answers"></div><p id="feedback"></p></div></div><div id="fx" class="fx"></div><div id="shop" class="shop"><div class="shopbox"><div style="display:flex;justify-content:space-between"><h2>Pet Shop</h2><button id="shopClose">✕</button></div><div id="pets" class="pets"></div></div></div><script>
const W={"people":{"title":"People Village","subtitle":"World 1 · People Review","icon":"👥","color1":"#7c3aed","color2":"#06b6d4","words":[["actor","男演员"],["actress","女演员"],["adult","成年人"],["artist","艺术家"],["baby","婴儿"],["boy","男孩"],["boyfriend","男朋友"],["child","小孩"],["customer","顾客"],["dancer","舞者"],["doctor","医生"],["driver","司机"],["farmer","农夫"],["friend","朋友"],["girlfriend","女朋友"],["man","男人"],["member","成员"],["neighbour","邻居"],["nurse","护士"],["parent","父母"],["partner","伴侣"],["people","人们"],["person","人"],["player","运动员"],["policeman","警察"],["reader","读者"],["scientist","科学家"],["singer","歌手"],["student","学生"],["teacher","老师"],["teenager","青少年"],["tourist","游客"],["visitor","访客"],["waiter","服务员"],["worker","工人"],["writer","作家"],["woman","女人"]]},"family":{"title":"Family Home Valley","subtitle":"World 2 · Family Review","icon":"🏡","color1":"#ec4899","color2":"#8b5cf6","words":[["aunt","阿姨／姑妈"],["brother","兄弟"],["cousin","表兄弟姐妹"],["dad","爸爸"],["daughter","女儿"],["family","家庭"],["father","父亲"],["grandfather","爷爷／外公"],["grandmother","奶奶／外婆"],["grandparent","祖父母"],["husband","丈夫"],["mother","母亲"],["mum","妈妈"],["sister","姐妹"],["son","儿子"],["uncle","叔叔／舅舅"],["wife","妻子"]]},"animals":{"title":"Animal Forest Island","subtitle":"World 3 · Animals Review","icon":"🐾","color1":"#0f766e","color2":"#22c55e","words":[["animal","动物"],["bird","鸟"],["cat","猫"],["chicken","鸡"],["cow","牛"],["dog","狗"],["elephant","大象"],["fish","鱼"],["horse","马"],["lion","狮子"],["mouse","老鼠"],["pig","猪"],["rabbit","兔子"],["sheep","羊"],["snake","蛇"]]},"food":{"title":"Food & Drink Kingdom","subtitle":"World 4 · Food & Drink Review","icon":"🍽️","color1":"#f97316","color2":"#eab308","words":[["apple","苹果"],["banana","香蕉"],["beer","啤酒"],["bread","面包"],["breakfast","早餐"],["butter","黄油"],["cake","蛋糕"],["carrot","胡萝卜"],["cheese","奶酪"],["chicken","鸡肉"],["chocolate","巧克力"],["coffee","咖啡"],["cream","奶油"],["dinner","晚餐"],["egg","鸡蛋"],["fish","鱼"],["food","食物"],["fruit","水果"],["ice cream","冰淇淋"],["juice","果汁"],["lunch","午餐"],["meat","肉"],["milk","牛奶"],["onion","洋葱"],["orange","橙子"],["pasta","意大利面"],["pepper","胡椒"],["pizza","披萨"],["potato","土豆"],["rice","米饭"],["salad","沙拉"],["salt","盐"],["sandwich","三明治"],["soup","汤"],["sugar","糖"],["tea","茶"],["tomato","西红柿"],["vegetable","蔬菜"],["water","水"],["wine","葡萄酒"]]},"school":{"title":"School Castle","subtitle":"World 5 · School Review","icon":"🏫","color1":"#2563eb","color2":"#14b8a6","words":[["book","书"],["class","班级"],["classroom","教室"],["college","学院"],["computer","电脑"],["course","课程"],["desk","书桌"],["dictionary","字典"],["exam","考试"],["homework","作业"],["language","语言"],["lesson","课"],["library","图书馆"],["map","地图"],["page","页"],["paper","纸"],["pen","钢笔"],["pencil","铅笔"],["project","项目"],["question","问题"],["school","学校"],["science","科学"],["sentence","句子"],["spelling","拼写"],["student","学生"],["study","学习"],["teacher","老师"],["test","测试"],["university","大学"],["word","单词"],["writing","写作"]]},"transport":{"title":"Transport City","subtitle":"World 6 · Transport Review","icon":"🚆","color1":"#0ea5e9","color2":"#f97316","words":[["airport","机场"],["bicycle","自行车"],["bike","自行车"],["boat","船"],["bus","公交车"],["car","汽车"],["flight","航班"],["journey","旅程"],["plane","飞机"],["road","道路"],["station","车站"],["taxi","出租车"],["ticket","票"],["traffic","交通"],["train","火车"],["travel","旅行"],["trip","旅行"]]},"places":{"title":"Places Kingdom","subtitle":"World 7 · Places Review","icon":"🏙️","color1":"#0f766e","color2":"#8b5cf6","words":[["apartment","公寓"],["bank","银行"],["beach","海滩"],["cafe","咖啡馆"],["cinema","电影院"],["city","城市"],["country","国家"],["farm","农场"],["garden","花园"],["gym","体育馆"],["hospital","医院"],["hotel","酒店"],["house","房子"],["kitchen","厨房"],["market","市场"],["museum","博物馆"],["office","办公室"],["park","公园"],["restaurant","餐厅"],["room","房间"],["school","学校"],["shop","商店"],["supermarket","超市"],["theatre","剧院"],["toilet","厕所"],["town","城镇"],["village","村庄"]]},"colours":{"title":"Rainbow Colour Land","subtitle":"World 8 · Colours Review","icon":"🌈","color1":"#db2777","color2":"#7c3aed","words":[["black","黑色"],["blue","蓝色"],["brown","棕色"],["green","绿色"],["grey","灰色"],["orange","橙色"],["pink","粉色"],["purple","紫色"],["red","红色"],["white","白色"],["yellow","黄色"]]},"clothes":{"title":"Clothes Kingdom","subtitle":"World 9 · Clothes Review","icon":"👕","color1":"#0f766e","color2":"#ec4899","words":[["bag","包包"],["belt","皮带"],["boot","靴子"],["cap","帽子"],["coat","外套"],["dress","连衣裙"],["glove","手套"],["hat","帽子"],["jacket","夹克"],["jeans","牛仔裤"],["shirt","衬衫"],["shoe","鞋子"],["shorts","短裤"],["skirt","裙子"],["sock","袜子"],["sweater","毛衣"],["T-shirt","T恤"],["tie","领带"],["trousers","长裤"],["watch","手表"]]},"weather":{"title":"Weather Mountain","subtitle":"World 10 · Weather Review","icon":"🌤️","color1":"#0284c7","color2":"#f59e0b","words":[["cloud","云"],["cloudy","多云"],["cold","寒冷"],["cool","凉爽"],["dry","干燥"],["fog","雾"],["foggy","有雾"],["hot","炎热"],["ice","冰"],["rain","雨"],["rainy","下雨"],["sky","天空"],["snow","雪"],["storm","暴风雨"],["sun","太阳"],["sunny","晴天"],["warm","温暖"],["weather","天气"],["wet","潮湿"],["wind","风"],["windy","有风"]]},"numbers":{"title":"Number Kingdom","subtitle":"World 11 · Numbers Review","icon":"🔢","color1":"#7c3aed","color2":"#22c55e","words":[["zero","零"],["one","一"],["two","二"],["three","三"],["four","四"],["five","五"],["six","六"],["seven","七"],["eight","八"],["nine","九"],["ten","十"],["eleven","十一"],["twelve","十二"],["thirteen","十三"],["fourteen","十四"],["fifteen","十五"],["sixteen","十六"],["seventeen","十七"],["eighteen","十八"],["nineteen","十九"],["twenty","二十"]]},"time":{"title":"Time Tower","subtitle":"World 12 · Time Review","icon":"🕒","color1":"#2563eb","color2":"#9333ea","words":[["clock","时钟"],["day","天"],["hour","小时"],["minute","分钟"],["month","月份"],["morning","早上"],["afternoon","下午"],["evening","傍晚"],["night","夜晚"],["today","今天"],["tomorrow","明天"],["yesterday","昨天"],["week","星期"],["weekend","周末"],["year","年份"],["time","时间"],["o'clock","点钟"],["Monday","星期一"],["Tuesday","星期二"],["Wednesday","星期三"],["Thursday","星期四"],["Friday","星期五"],["Saturday","星期六"],["Sunday","星期日"]]},"body":{"title":"Body Fortress","subtitle":"World 13 · Body Review","icon":"🧍","color1":"#dc2626","color2":"#f59e0b","words":[["arm","手臂"],["back","背部"],["body","身体"],["ear","耳朵"],["eye","眼睛"],["face","脸"],["finger","手指"],["foot","脚"],["hair","头发"],["hand","手"],["head","头"],["leg","腿"],["mouth","嘴巴"],["neck","脖子"],["nose","鼻子"],["shoulder","肩膀"],["stomach","肚子"],["tooth","牙齿"],["teeth","牙齿（复数）"]]},"verbs":{"title":"Action Valley","subtitle":"World 14 · Action Verbs","icon":"🏃","color1":"#16a34a","color2":"#2563eb","words":[["ask","询问"],["come","来"],["cook","烹饪"],["dance","跳舞"],["drink","喝"],["eat","吃"],["go","去"],["jump","跳"],["listen","听"],["look","看"],["play","玩"],["read","阅读"],["run","跑"],["sing","唱歌"],["sit","坐"],["sleep","睡觉"],["speak","说"],["stand","站"],["swim","游泳"],["walk","走路"],["watch","观看"],["write","写"]]},"adjectives":{"title":"Adjective Peak","subtitle":"World 15 · Adjectives","icon":"⭐","color1":"#7c3aed","color2":"#f97316","words":[["big","大"],["small","小"],["long","长"],["short","短"],["tall","高"],["young","年轻"],["old","老"],["new","新的"],["good","好的"],["bad","坏的"],["happy","开心"],["sad","伤心"],["fast","快"],["slow","慢"],["clean","干净"],["dirty","肮脏"],["easy","容易"],["difficult","困难"],["strong","强壮"],["weak","虚弱"],["beautiful","美丽"],["ugly","丑"]]}};const S={world:null,mode:'rush',i:0,q:[],wrong:[],xp:0,coins:0,lives:3,pet:'🐶',owned:new Set(['🐶'])};const $=x=>document.getElementById(x),sh=a=>[...a].sort(()=>Math.random()-.5);const pets=[['🐶',0],['🐰',250],['🐱',400],['🐼',650],['🦊',900],['🦄',1300],['🐉',1800],['🐯',2500]];function sync(){$('xp').textContent=S.xp;$('coins').textContent=S.coins;$('lives').textContent=S.lives}function fx(ok){const good=['🐉 DRAGON POWER','⚡ THUNDER','🦄 MAGIC','🔥 PHOENIX'],bad=['👾 SWALLOWED','🔥 FIREBALL','⚡ SHOCK','🧊 FROZEN','🕳️ TRAP'];$('fx').textContent=(ok?good:bad)[Math.floor(Math.random()*(ok?good:bad).length)];$('fx').className='fx show';setTimeout(()=>$('fx').className='fx',900)}function render(){const g=$('grid');g.innerHTML='';Object.entries(W).forEach(([id,w],n)=>{const b=document.createElement('button');b.className='world';b.style.background=`linear-gradient(135deg,${w.color1},${w.color2})`;b.innerHTML=`<div style="font-size:42px">${w.icon}</div><b>World ${n+1}</b><small>${w.title}</small><small>${w.words.length} words</small>`;b.onclick=()=>openWorld(id);g.appendChild(b)})}function openWorld(id){S.world=id;$('home').style.display='none';$('view').style.display='grid';const w=W[id];$('wtitle').textContent=w.title;$('count').textContent=w.words.length+' PDF words';$('wordlist').innerHTML=w.words.map(x=>`<span class="chip">${x[0]}</span>`).join('')}document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;$('modeTitle').textContent=b.textContent;$('desc').textContent='Uses every word in this World.'});$('back').onclick=()=>{$('view').style.display='none';$('home').style.display='block'};$('play').onclick=start;$('close').onclick=()=>{$('overlay').style.display='none'};function options(item,eng){const k=eng?0:1;return sh([item[k],...sh(W[S.world].words.filter(x=>x[0]!==item[0])).slice(0,3).map(x=>x[k])])}function start(){S.i=0;S.wrong=[];S.lives=3;S.q=sh(W[S.world].words);$('overlay').style.display='flex';$('gameTitle').textContent=S.mode.toUpperCase();show()}function show(){if(S.i>=S.q.length)return report();const item=S.q[S.i],eng=S.mode==='reverse',spell=S.mode==='spell';$('progress').textContent=`${S.i+1} / ${S.q.length}`;$('question').textContent=spell?item[1]:(eng?item[1]:item[0]);let opts,correct;if(spell){const word=item[0],pos=Math.floor(Math.random()*word.length),m=word[pos];S.cur={item,correct:m};$('question').textContent=item[1]+' · '+word.slice(0,pos)+'_'+word.slice(pos+1);opts=sh([m,...sh('abcdefghijklmnopqrstuvwxyz'.split('').filter(x=>x!==m)).slice(0,3)]);correct=m}else{correct=item[eng?0:1];S.cur={item,correct};opts=options(item,eng)}$('answers').innerHTML='';opts.forEach(v=>{const b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>answer(b,v);$('answers').appendChild(b)})}function answer(b,v){document.querySelectorAll('.ans').forEach(x=>x.disabled=true);if(v===S.cur.correct){b.classList.add('good');S.xp+=20;S.coins+=10;fx(true)}else{b.classList.add('bad');S.xp=Math.max(0,S.xp-10);S.coins=Math.max(0,S.coins-5);S.lives=Math.max(0,S.lives-1);S.wrong.push({word:S.cur.item[0],your:v,correct:S.cur.correct,meaning:S.cur.item[1]});fx(false)}sync();setTimeout(()=>{S.i++;show()},950)}function report(){const total=S.q.length,wrong=S.wrong.length,correct=total-wrong,acc=Math.round(correct/total*100);$('question').textContent='Battle Report';$('progress').textContent=`Correct ${correct}/${total} · Accuracy ${acc}%`;$('answers').innerHTML=S.wrong.length?S.wrong.map((x,i)=>`<div class="panel" style="grid-column:1/-1"><b>${i+1}. ${x.word}</b><br>Your: <span style="color:#dc2626">${x.your}</span><br>Correct: <span style="color:#16a34a">${x.correct}</span> (${x.meaning})</div>`).join(''):'<div class="panel">Perfect Clear!</div>';$('feedback').textContent='Mistake Review completed.'}function renderPets(){$('pets').innerHTML='';pets.forEach(([e,p])=>{const c=document.createElement('div');c.className='petcard';const own=S.owned.has(e);c.innerHTML=`<div class="petemoji">${e}</div><div>🪙 ${p}</div><button class="btn">${own?'Equip':'Buy'}</button>`;c.querySelector('button').onclick=()=>{if(own){S.pet=e}else if(S.coins>=p){S.coins-=p;S.owned.add(e);S.pet=e;sync();renderPets()}};$('pets').appendChild(c)})}$('shopBtn').onclick=()=>{$('shop').style.display='flex';renderPets()};$('shopClose').onclick=()=>{$('shop').style.display='none'};render();sync();
</script></body></html>
